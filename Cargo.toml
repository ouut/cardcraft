[package]
name = "cardcraft"
version = "0.2.4"
edition = "2021"

[dependencies]
steel-core = "0.8.3"
ratatui = "0.30.2"
crossterm = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rand = "0.10.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3"
iroh = "1.4.1"
ansi-to-tui = "8.0.1"
