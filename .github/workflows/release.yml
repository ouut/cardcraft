name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: cardcraft
            archive_ext: tar.gz
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: cardcraft
            archive_ext: tar.gz
          # macOS Intel x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: cardcraft
            archive_ext: tar.gz
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: cardcraft.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Linux & macOS)
        if: matrix.os != 'windows-latest'
        run: |
          STAGING="cardcraft-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$STAGING/"
          cp README.md "$STAGING/"
          cp -r docs "$STAGING/"
          cp -r scripts "$STAGING/"
          tar czvf "cardcraft-${{ matrix.target }}.tar.gz" "$STAGING"

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $staging = "cardcraft-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $staging
          Copy-Item README.md -Destination $staging
          Copy-Item -Recurse docs -Destination $staging
          Copy-Item -Recurse scripts -Destination $staging
          Compress-Archive -Path $staging -DestinationPath "cardcraft-${{ matrix.target }}.zip"

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: CardCraft ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          generate_release_notes: true
          files: |
            cardcraft-*.tar.gz
            cardcraft-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
