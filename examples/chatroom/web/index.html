<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardCraft Chatroom - Web Client</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; padding: 16px; overflow: hidden; }
    header { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; background: var(--green); color: #fff; }
    .badge.offline { background: var(--red); }
    main { flex: 1; display: flex; gap: 12px; min-height: 0; }
    .chat-box { flex: 3; background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-y: auto; white-space: pre-wrap; font-size: 14px; line-height: 1.4; color: var(--text); }
    .sidebar { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .sidebar h3 { font-size: 13px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .sidebar ul { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    footer { margin-top: 12px; display: flex; gap: 8px; }
    input { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: var(--accent); }
    button { background: #238636; border: none; color: #fff; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #2ea043; }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 18px;">💬</span>
      <h2 style="font-size: 15px; color: var(--accent);">CardCraft Terminal Chatroom</h2>
    </div>
    <span id="statusBadge" class="badge offline">CONNECTING...</span>
  </header>

  <main>
    <div class="chat-box" id="chatBox"></div>
    <div class="sidebar">
      <h3>Quick Commands</h3>
      <ul>
        <li><code>/nick &lt;name&gt;</code> - 改名</li>
        <li><code>/w &lt;user&gt; &lt;msg&gt;</code> - 私聊</li>
        <li><code>/who</code> - 在线成员</li>
        <li><code>/help</code> - 帮助菜单</li>
        <li><code>/clear</code> - 清屏</li>
      </ul>
    </div>
  </main>

  <footer>
    <input type="text" id="msgInput" placeholder="Type message or command (/help, /nick)..." autofocus />
    <button onclick="sendMsg()">Send</button>
  </footer>

  <script>
    const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
    let ws = null;
    const chatBox = document.getElementById("chatBox");
    const statusBadge = document.getElementById("statusBadge");
    const msgInput = document.getElementById("msgInput");

    function ansiToHtml(str) {
      const colors = {
        30: "#484f58", 31: "#f85149", 32: "#3fb950", 33: "#d29922",
        34: "#58a6ff", 35: "#bc8cff", 36: "#39c5cf", 37: "#f0f6fc",
        90: "#8b949e", 91: "#ff7b72", 92: "#56d364", 93: "#e3b341",
        94: "#79c0ff", 95: "#d2a8ff", 96: "#56d4dd", 97: "#ffffff"
      };
      let html = "";
      let openSpans = 0;
      const parts = str.split(/\x1b\[([0-9;]+)m/);
      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
          const escaped = parts[i].replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          html += escaped;
        } else {
          const codes = parts[i].split(";").map(Number);
          for (const code of codes) {
            if (code === 0) {
              while (openSpans > 0) { html += "</span>"; openSpans--; }
            } else if (colors[code]) {
              html += `<span style="color:${colors[code]}">`;
              openSpans++;
            } else if (code === 1) {
              html += `<span style="font-weight:bold">`;
              openSpans++;
            }
          }
        }
      }
      while (openSpans > 0) { html += "</span>"; openSpans--; }
      return html;
    }

    function appendMessage(text) {
      const line = document.createElement("div");
      line.innerHTML = ansiToHtml(text);
      chatBox.appendChild(line);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function connect() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        statusBadge.textContent = "ONLINE";
        statusBadge.className = "badge";
      };
      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          const grid = data.grid || (data.snapshot && data.snapshot.grid);
          if (grid && grid.length > 0) {
            chatBox.innerHTML = ansiToHtml(grid.join("\n"));
            chatBox.scrollTop = chatBox.scrollHeight;
          } else if (data.message) {
            appendMessage(data.message);
          } else if (data.feedback && data.feedback !== "OK") {
            appendMessage(data.feedback);
          }
        } catch (_) {
          appendMessage(e.data);
        }
      };
      ws.onclose = () => {
        statusBadge.textContent = "OFFLINE";
        statusBadge.className = "badge offline";
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
    }

    function sendMsg() {
      const val = msgInput.value.trim();
      if (!val || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(val);
      msgInput.value = "";
    }

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMsg();
    });

    connect();
  </script>
</body>
</html>
