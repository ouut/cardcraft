<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardCraft - Web Client</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .status-badge { background: #238636; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .status-badge.disconnected { background: var(--danger); }
    
    .stats-row { display: flex; gap: 20px; font-size: 14px; }
    .stat-item span { font-weight: bold; color: var(--accent); }

    main { display: flex; flex: 1; gap: 12px; min-height: 0; }
    
    .board-panel { flex: 2; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: bold; color: var(--accent); background: #21262d; font-size: 13px; display: flex; justify-content: space-between; }
    .stacks-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    
    .stack-card { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .stack-info { display: flex; align-items: center; gap: 10px; }
    .stack-id { color: #8b949e; font-weight: bold; min-width: 32px; }
    .cards-box { display: flex; gap: 6px; flex-wrap: wrap; }
    .card-pill { background: #21262d; border: 1px solid #30363d; padding: 3px 8px; border-radius: 4px; font-size: 13px; font-weight: bold; color: #58a6ff; }
    .card-pill.Villager { color: #38bdf8; border-color: #0284c7; }
    .card-pill.Berry, .card-pill.BerryBush { color: #f43f5e; border-color: #be123c; }
    .card-pill.Wood { color: #fbbf24; border-color: #d97706; }
    .card-pill.Coin { color: #eab308; border-color: #ca8a04; }

    .progress-bar-container { width: 140px; background: #21262d; border-radius: 4px; height: 10px; overflow: hidden; border: 1px solid #30363d; }
    .progress-bar-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.2s; }
    
    .side-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .logs-panel { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
    .logs-body { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; color: #8b949e; }
    .logs-body p { line-height: 1.4; }
    .logs-body p:last-child { color: var(--text); font-weight: bold; }

    .quick-actions { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    button.btn-chip { background: #21262d; border: 1px solid #30363d; color: var(--text); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    button.btn-chip:hover { background: #30363d; border-color: var(--accent); color: white; }

    footer { margin-top: 12px; display: flex; gap: 8px; }
    .cmd-input { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; color: white; font-size: 14px; outline: none; }
    .cmd-input:focus { border-color: var(--accent); }
    .btn-send { background: #238636; border: none; color: white; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-send:hover { background: #2ea043; }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2 style="font-size: 16px; color: var(--accent);">CardCraft Web Console</h2>
      <span id="connBadge" class="status-badge disconnected">CONNECTING...</span>
    </div>
    <div class="stats-row">
      <div class="stat-item">Moon: <span id="moonVal">1</span></div>
      <div class="stat-item">Day: <span id="dayVal">30s</span></div>
      <div class="stat-item">Food: <span id="foodVal">1/1</span></div>
      <div class="stat-item">Gold: <span id="goldVal">5G</span></div>
      <div class="stat-item">Cards: <span id="cardCountVal">5/15</span></div>
    </div>
  </header>

  <main>
    <div class="board-panel">
      <div class="panel-header">
        <span>Active Card Stacks (Slots)</span>
        <span id="gameStatus">STATUS: RUNNING</span>
      </div>
      <div class="stacks-list" id="stacksList">
        <div style="padding: 20px; text-align: center; color: #8b949e;">Waiting for server snapshot...</div>
      </div>
    </div>

    <div class="side-panel">
      <div class="quick-actions">
        <button class="btn-chip" onclick="sendCmd('b basic')">Buy Basic Pack (3G)</button>
        <button class="btn-chip" onclick="sendCmd('b food')">Buy Food Pack (5G)</button>
        <button class="btn-chip" onclick="sendCmd('s 1 2')">Stack [1] onto [2]</button>
        <button class="btn-chip" onclick="sendCmd('u 2')">Unstack [2]</button>
        <button class="btn-chip" onclick="sendCmd('w 5')">Wait 5s</button>
        <button class="btn-chip" onclick="sendCmd('p')">Pause/Resume</button>
      </div>

      <div class="logs-panel">
        <div class="panel-header">System Event Log & Chat</div>
        <div class="logs-body" id="logsBody">
          <p>Connecting to CardCraft server via WebSocket...</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <input type="text" id="cmdInput" class="cmd-input" placeholder="Type CAD command (e.g. 's 1 2', 'say Hello') or '(' for Lisp..." autofocus />
    <button class="btn-send" onclick="submitCmd()">EXECUTE</button>
  </footer>

  <script>
    const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
    let ws = null;
    let cmdHistory = [];
    let historyIdx = -1;

    function connect() {
      const badge = document.getElementById("connBadge");
      badge.textContent = "CONNECTING...";
      badge.className = "status-badge disconnected";

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        badge.textContent = "ONLINE (WS)";
        badge.className = "status-badge";
        addLog("Connected to CardCraft WebSocket server.");
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.meta) {
            renderSnapshot(data);
          } else if (data.snapshot) {
            renderSnapshot(data.snapshot);
            if (data.feedback && data.feedback !== "OK") {
              addLog("Feedback: " + data.feedback);
            }
          }
        } catch (e) {
          addLog("Message: " + event.data);
        }
      };

      ws.onclose = () => {
        badge.textContent = "OFFLINE";
        badge.className = "status-badge disconnected";
        addLog("Disconnected from server. Reconnecting in 2s...");
        setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();
    }

    function renderSnapshot(snap) {
      if (snap.meta) {
        document.getElementById("moonVal").textContent = snap.meta.moon;
        document.getElementById("dayVal").textContent = Math.round(snap.meta.day_seconds_left) + "s";
        document.getElementById("foodVal").textContent = snap.meta.food_current + "/" + snap.meta.food_required;
        document.getElementById("goldVal").textContent = snap.meta.gold + "G";
        document.getElementById("cardCountVal").textContent = snap.meta.card_count + "/" + snap.meta.card_limit;
        document.getElementById("gameStatus").textContent = "STATUS: " + snap.meta.status;
      }

      if (snap.stacks) {
        const list = document.getElementById("stacksList");
        list.innerHTML = "";
        snap.stacks.forEach(s => {
          const div = document.createElement("div");
          div.className = "stack-card";

          const cardsHtml = s.cards.map(c => `<span class="card-pill ${c}">${c}</span>`).join("");
          const prog = s.progress !== null && s.progress !== undefined ? Math.round(s.progress * 100) : 0;
          const statusText = s.recipe_name ? `${s.recipe_name} (${prog}%)` : s.status;

          div.innerHTML = `
            <div class="stack-info">
              <span class="stack-id">[${s.id}]</span>
              <div class="cards-box">${cardsHtml}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <span style="font-size: 12px; color: #8b949e;">${statusText}</span>
              ${s.status === "Crafting" ? `
                <div class="progress-bar-container">
                  <div class="progress-bar-fill" style="width: ${prog}%;"></div>
                </div>
              ` : ''}
            </div>
          `;
          list.appendChild(div);
        });
      }

      if (snap.logs) {
        const logsBox = document.getElementById("logsBody");
        logsBox.innerHTML = snap.logs.map(l => `<p>• ${l}</p>`).join("");
        logsBox.scrollTop = logsBox.scrollHeight;
      }
    }

    function addLog(text) {
      const logsBox = document.getElementById("logsBody");
      const p = document.createElement("p");
      p.textContent = "• " + text;
      logsBox.appendChild(p);
      logsBox.scrollTop = logsBox.scrollHeight;
    }

    function sendCmd(cmd) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(cmd);
      } else {
        addLog("Error: WebSocket not connected.");
      }
    }

    function submitCmd() {
      const input = document.getElementById("cmdInput");
      const val = input.value.trim();
      if (!val) return;
      cmdHistory.push(val);
      historyIdx = cmdHistory.length;
      sendCmd(val);
      input.value = "";
    }

    document.getElementById("cmdInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        submitCmd();
      } else if (e.key === "ArrowUp") {
        if (historyIdx > 0) {
          historyIdx--;
          e.target.value = cmdHistory[historyIdx];
        }
      } else if (e.key === "ArrowDown") {
        if (historyIdx < cmdHistory.length - 1) {
          historyIdx++;
          e.target.value = cmdHistory[historyIdx];
        } else {
          historyIdx = cmdHistory.length;
          e.target.value = "";
        }
      }
    });

    connect();
  </script>
</body>
</html>
